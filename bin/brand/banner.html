<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0}
#b{width:1544px;height:500px;position:relative;overflow:hidden;font-family:-apple-system,"SF Pro Display","Segoe UI",Inter,sans-serif;
 background:radial-gradient(900px 520px at 1150px 80px,#4C3A9E 0%,rgba(76,58,158,0) 70%),linear-gradient(135deg,#2B1E6B 0%,#140F3D 100%)}
.copy{position:absolute;left:110px;top:50%;transform:translateY(-50%);max-width:640px}
h1{margin:0;font-size:118px;line-height:1;font-weight:800;letter-spacing:-3px;color:#fff}
h1 span{color:#FF6B8A}
p{margin:26px 0 0;font-size:34px;line-height:1.35;color:#CFC8F5;font-weight:500}
.chips{display:flex;gap:12px;margin-top:30px}
.chip{padding:10px 18px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:#E9E5FF;font-size:20px;font-weight:600}
svg{position:absolute;right:120px;bottom:0}
</style></head><body><div id="b">
<div class="copy"><h1>Like<span>nook</span></h1>
<p>Like &amp; dislike buttons, reactions<br>and Most Liked Posts</p>
<div class="chips"><span class="chip">Blocks &amp; widgets</span><span class="chip">Analytics</span><span class="chip">Cache-friendly</span></div></div>
<svg width="560" height="470" viewBox="0 0 560 470" xmlns="http://www.w3.org/2000/svg">
 <defs><linearGradient id="pill" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF6B6B"/><stop offset="1" stop-color="#FF3D7F"/></linearGradient></defs>
 <!-- nook -->
 <path d="M120 470 V250 A160 160 0 0 1 440 250 V470 Z" fill="#FFF8F1"/>
 <path d="M148 470 V254 A132 132 0 0 1 412 254 V470 Z" fill="#FFE8DC"/>
 <path d="M180 470 V262 A100 100 0 0 1 380 262 V470 Z" fill="#FFD4C2"/>
 <!-- like pill (active) -->
 <g transform="translate(280 300)">
  <rect x="-104" y="-48" width="208" height="96" rx="48" fill="url(#pill)"/>
  <rect x="-92" y="-42" width="184" height="36" rx="18" fill="#fff" opacity=".22"/>
  <path d="M-28 16 L0 -16 L28 16" fill="none" stroke="#fff" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
 </g>
 <!-- dislike pill -->
 <g transform="translate(280 414)">
  <rect x="-86" y="-40" width="172" height="80" rx="40" fill="#fff" stroke="#D9D3F5" stroke-width="5"/>
  <path d="M-22 -10 L0 14 L22 -10" fill="none" stroke="#7C6FD6" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
 </g>
 <!-- hearts rising out of the nook -->
 <g fill="#FF3D7F"><path transform="translate(280 112) scale(2.7)" d="M0 13 C-20 0 -18 -16 -8 -16 C-3 -16 0 -12 0 -9 C0 -12 3 -16 8 -16 C18 -16 20 0 0 13 Z"/></g>
 <g fill="#FF8FB1"><path transform="translate(176 176) scale(1.25)" d="M0 13 C-20 0 -18 -16 -8 -16 C-3 -16 0 -12 0 -9 C0 -12 3 -16 8 -16 C18 -16 20 0 0 13 Z"/>
  <path transform="translate(390 160) scale(1.05)" d="M0 13 C-20 0 -18 -16 -8 -16 C-3 -16 0 -12 0 -9 C0 -12 3 -16 8 -16 C18 -16 20 0 0 13 Z"/></g>
 <!-- sparkles -->
 <g fill="#FFD166"><circle cx="98" cy="300" r="9"/><circle cx="470" cy="286" r="7"/><circle cx="452" cy="210" r="5"/><circle cx="118" cy="226" r="5"/></g>
</svg>
</div></body></html>
